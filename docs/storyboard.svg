<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <linearGradient id="paper" x1="0" x2="1">
      <stop offset="0" stop-color="#F4EEE4"/>
      <stop offset="0.6" stop-color="#F4E0C4"/>
      <stop offset="1" stop-color="#EACFC0"/>
    </linearGradient>
    <linearGradient id="joined" x1="0" x2="1">
      <stop offset="0" stop-color="#738CB8"/>
      <stop offset="1" stop-color="#8580BD"/>
    </linearGradient>
    <linearGradient id="rise" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B5566A"/>
      <stop offset="0.5" stop-color="#7A5F9A"/>
      <stop offset="1" stop-color="#34558A"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="470" rx="24" fill="url(#paper)"/>

  <text x="60" y="54" font-size="13" letter-spacing="4" fill="#2B2622" opacity="0.6" font-family="Helvetica, Arial, sans-serif">ONE SCROLL · ONE RIVER · FIVE CHAPTERS</text>

  <!-- The sun's path across the sky -->
  <path d="M110 150 Q 600 40 1090 150" fill="none" stroke="#A07C3F" stroke-width="1.2" stroke-dasharray="2 7" stroke-linecap="round"/>
  <circle cx="110" cy="150" r="13" fill="#F3D896"/>
  <circle cx="1090" cy="150" r="13" fill="#E5805A"/>
  <text x="600" y="84" font-size="13" font-style="italic" text-anchor="middle" fill="#A07C3F">the sun crosses the sky as you scroll; the paper warms from dawn to dusk</text>

  <!-- The river rising at the confluence -->
  <path d="M520 262 C 540 150, 575 128, 600 128 S 660 150, 680 262 Z" fill="url(#rise)" opacity="0.9"/>

  <!-- Two streams, then one -->
  <path d="M110 232 C 250 205, 380 250, 520 240 S 580 262, 610 262" fill="none" stroke="#C4705E" stroke-width="14" stroke-linecap="round"/>
  <path d="M110 292 C 250 318, 380 275, 520 284 S 580 262, 610 262" fill="none" stroke="#3F5F8F" stroke-width="14" stroke-linecap="round"/>
  <path d="M600 262 C 760 250, 920 276, 1090 262" fill="none" stroke="url(#joined)" stroke-width="30" stroke-linecap="round"/>

  <text x="150" y="216" font-size="17" font-style="italic" fill="#C4705E">Tina</text>
  <text x="150" y="328" font-size="17" font-style="italic" fill="#3F5F8F">Emmanuel</text>
  <text x="600" y="206" font-size="30" text-anchor="middle" fill="#F4EEE4">T <tspan fill="#EBCB8B" font-style="italic" font-size="22">&amp;</tspan> E</text>

  <!-- Chapters -->
  <g font-size="13" fill="#2B2622">
    <g text-anchor="middle">
      <line x1="110" y1="352" x2="110" y2="366" stroke="#A07C3F"/>
      <line x1="355" y1="352" x2="355" y2="366" stroke="#A07C3F"/>
      <line x1="600" y1="352" x2="600" y2="366" stroke="#A07C3F"/>
      <line x1="845" y1="352" x2="845" y2="366" stroke="#A07C3F"/>
      <line x1="1090" y1="352" x2="1090" y2="366" stroke="#A07C3F"/>

      <text x="110" y="388" font-size="17"><tspan fill="#A07C3F" font-style="italic">i.</tspan> The source</text>
      <text x="355" y="388" font-size="17"><tspan fill="#A07C3F" font-style="italic">ii.</tspan> A note</text>
      <text x="600" y="388" font-size="17"><tspan fill="#A07C3F" font-style="italic">iii.</tspan> The blend</text>
      <text x="845" y="388" font-size="17"><tspan fill="#A07C3F" font-style="italic">iv.</tspan> Guwahati</text>
      <text x="1090" y="388" font-size="17"><tspan fill="#A07C3F" font-style="italic">v.</tspan> The reply</text>

      <g font-family="Helvetica, Arial, sans-serif" font-size="11.5" opacity="0.65">
        <text x="110" y="410">two streams spring</text>
        <text x="110" y="426">from the mountains</text>
        <text x="355" y="410">the world travels sideways,</text>
        <text x="355" y="426">verses rise as they arrive</text>
        <text x="600" y="410">the world holds still, the river</text>
        <text x="600" y="426">rises, two colours become one</text>
        <text x="845" y="410">date, venues, the day,</text>
        <text x="845" y="426">how to get there</text>
        <text x="1090" y="410">the page turns downward;</text>
        <text x="1090" y="426">RSVP floats on the water</text>
      </g>
    </g>
  </g>

  <!-- Scroll axis -->
  <line x1="110" y1="352" x2="1090" y2="352" stroke="#2B2622" stroke-opacity="0.25"/>
  <text x="1140" y="54" font-size="13" text-anchor="end" font-style="italic" fill="#2B2622" opacity="0.6">scroll down ↓ = travel downstream →</text>
</svg>
